name: Pipeline de CI/CD

on:
  push:
    branches: [ "main", "master", "principal" ]
  pull_request:
    branches: [ "main", "master", "principal" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Poetry
      uses: snok/install-poetry@v1

    - name: Instalar Dependências do Projeto
      run: poetry install --no-interaction

    - name: Executar Testes com Pytest
      run: poetry run pytest

    - name: Build da Imagem Docker
      run: docker build -t fastapi-app:latest .

    - name: Validar Container (Smoke Test)
      run: |
        docker run -d -p 8000:8000 --name test-container fastapi-app:latest
        sleep 5
        curl --fail http://localhost:8000/ || exit 1
        docker stop test-container
        docker rm test-container

 
