name: CI

on:
  push:
    branches: [ "principal", "main", "master" ]
  pull_request:
    branches: [ "principal", "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Poetry nativamente via curl
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Verificar versão do Poetry
      run: poetry --version

    - name: Instalar dependências com Poetry
      run: |
        poetry install --no-interaction --no-root

    - name: Executar testes com Pytest
      run: |
        poetry run pytest

    # --- ETAPA OBRIGATÓRIA DO DOCKER ---

    - name: Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Construir imagem Docker da aplicação
      run: |
        docker build -t fastapi-app:latest .

    - name: Validar container com docker run
      run: |
        docker run -d --name test-fastapi-container -p 8000:8000 fastapi-app:latest
        sleep 3
        docker ps | grep test-fastapi-container

 
