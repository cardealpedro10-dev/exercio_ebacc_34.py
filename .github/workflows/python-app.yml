name: Pipeline de CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  IMAGE_NAME: fastapi-app

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Instalar Dependências
      run: |
        poetry install --no-interaction --no-root

    - name: Executar Testes com Pytest
      run: |
        poetry run pytest

    - name: Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build da Imagem Docker
      run: |
        docker build -t ${{ env.IMAGE_NAME }}:latest .

    - name: Validar Container (Smoke Test)
      run: |
        # Executa o container em segundo plano mapeando a porta 8000
        docker run -d -p 8000:8000 --name test-container ${{ env.IMAGE_NAME }}:latest
       
        # Aguarda 5 segundos para a aplicação inicializar
        sleep 5
       
        # Faz uma requisição para garantir que a API está respondendo
        curl --fail http://localhost:8000/ || exit 1
       
        # Para e remove o container
        docker stop test-container
        docker rm test-container

 
