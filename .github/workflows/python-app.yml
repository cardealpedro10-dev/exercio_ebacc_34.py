name: Python Application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  IMAGE_NAME: fastapi-app

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Poetry
      uses: snok/install-poetry@v1

    - name: Install dependencies
      run: |
        poetry install

    - name: Run pytest
      run: |
        poetry run pytest
      # (O '|| true' foi removido para garantir que falhas nos testes parem o workflow)

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        load: true
        tags: ${{ env.IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Validate container with docker run
      run: |
        docker run -d --name test-container -p 8000:8000 ${{ env.IMAGE_NAME }}:latest
       
    - name: Smoke test
      run: |
        # Aguarda alguns segundos para a aplicação iniciar e testa se responde na porta 8000
        sleep 5
        curl --fail --retry 5 --retry-connrefused --retry-delay 2 http://localhost:8000/ || exit 1

 
