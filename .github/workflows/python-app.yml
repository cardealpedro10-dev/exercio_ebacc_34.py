name: Python application

on:
  push:
    branches: [ "main", "principal" ]
  pull_request:
    branches: [ "main", "principal" ]

permissions:
  contents: read

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest fastapi uvicorn httpx

    - name: Executar testes com Pytest
      run: pytest

    # --- ETAPA OBRIGATÓRIA DO DOCKER ---

    - name: Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Construir imagem Docker da aplicação
      run: docker build -t fastapi-app:latest .

    - name: Validar container com docker run
      run: |
        docker run -d --name test-fastapi-container -p 8000:8000 fastapi-app:latest
        sleep 3
        curl --fail http://localhost:8000/ || exit 1

 
